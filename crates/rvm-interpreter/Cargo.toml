[package]
name = "rvm-interpreter"
description = "Intérprete de referência da RSUVM: execução determinística com fuel, profundidade e traps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rvm-spec.workspace = true
rvm-ir.workspace = true
rvm-runtime.workspace = true
rvm-verify.workspace = true

[dev-dependencies]
rvm-ir = { workspace = true, features = ["test-helpers"] }
rvm-link.workspace = true

# Micro-benchmark pré-registrado de custo de chamada (docs/RELATORIOS/
# BENCHMARKS-PREREGISTRADOS.md). Não roda em CI; sem dependências externas.
[[bench]]
name = "chamada"
harness = false

[lints]
workspace = true
